<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>BlockWorld Adventures Preview 03 · Render gallery</title><style>body{margin:0;background:#edf0e3;color:#294a3d;font:15px system-ui}main{max-width:1500px;margin:auto;padding:32px}h1{font:42px Georgia}nav{display:flex;gap:8px;flex-wrap:wrap;margin:24px 0}button{border:0;background:#faf6ea;color:#294a3d;padding:12px;border-radius:12px;cursor:pointer}nav button[aria-pressed=true]{background:#294a3d;color:white}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,420px),1fr));gap:20px}figure{margin:0;background:#faf6ea;border-radius:16px;overflow:hidden}figure button{padding:0;width:100%;border-radius:0}img{width:100%;height:320px;object-fit:contain;display:block;background:#cedcc8}figcaption{padding:16px}[hidden]{display:none!important}dialog{max-width:95vw;border:0;padding:8px;border-radius:16px;background:#faf6ea}dialog img{max-width:90vw;height:80vh}dialog::backdrop{background:#102b24db}a{color:#294a3d}</style></head><body><main><small>BLOCKWORLD ADVENTURES · DEVELOPMENT PREVIEW 03</small><h1>One valley. Take the long way home.</h1><p>Actual browser renders of the connected world, maps and editor. Phone/tablet layouts are emulated. Physical Lenovo, iPhone and Safari testing remains unverified.</p><p><a href="adventures.html">Open the playable preview →</a></p><nav><button data-filter="all" aria-pressed="true">All views</button><button data-filter="world" aria-pressed="false">The valley</button><button data-filter="map" aria-pressed="false">Maps</button><button data-filter="phone" aria-pressed="false">Phone</button><button data-filter="editor" aria-pressed="false">Build & controls</button><button data-filter="comparison" aria-pressed="false">Before / after</button></nav><div class="grid"><figure data-group="world"><button class="zoom" aria-label="Enlarge Willowmere market square"><img src="screenshots/vale-centre.png" alt="Willowmere market square" loading="lazy"></button><figcaption>Willowmere market square</figcaption></figure><figure data-group="world"><button class="zoom" aria-label="Enlarge Residential street"><img src="screenshots/vale-street.png" alt="Residential street" loading="lazy"></button><figcaption>Residential street</figcaption></figure><figure data-group="world"><button class="zoom" aria-label="Enlarge Whispering Wood"><img src="screenshots/vale-woodland.png" alt="Whispering Wood" loading="lazy"></button><figcaption>Whispering Wood</figcaption></figure><figure data-group="world"><button class="zoom" aria-label="Enlarge Connecting road and forest transition"><img src="screenshots/vale-road.png" alt="Connecting road and forest transition" loading="lazy"></button><figcaption>Connecting road and forest transition</figcaption></figure><figure data-group="world"><button class="zoom" aria-label="Enlarge Maker’s Meadow"><img src="screenshots/vale-meadow.png" alt="Maker’s Meadow" loading="lazy"></button><figcaption>Maker’s Meadow</figcaption></figure><figure data-group="world"><button class="zoom" aria-label="Enlarge Brookside hamlet"><img src="screenshots/vale-hamlet.png" alt="Brookside hamlet" loading="lazy"></button><figcaption>Brookside hamlet</figcaption></figure><figure data-group="world"><button class="zoom" aria-label="Enlarge New-template tent scale, with Explorer"><img src="screenshots/vale-campScale.png" alt="New-template tent scale, with Explorer" loading="lazy"></button><figcaption>New-template tent scale, with Explorer</figcaption></figure><figure data-group="map"><button class="zoom" aria-label="Enlarge Full map from actual world data"><img src="screenshots/map-desktop-full.png" alt="Full map from actual world data" loading="lazy"></button><figcaption>Full map from actual world data</figcaption></figure><figure data-group="phone"><button class="zoom" aria-label="Enlarge Phone map opening at a useful local zoom"><img src="screenshots/map-phone-full.png" alt="Phone map opening at a useful local zoom" loading="lazy"></button><figcaption>Phone map opening at a useful local zoom</figcaption></figure><figure data-group="phone"><button class="zoom" aria-label="Enlarge Phone live minimap and touch controls"><img src="screenshots/map-phone-mini.png" alt="Phone live minimap and touch controls" loading="lazy"></button><figcaption>Phone live minimap and touch controls</figcaption></figure><figure data-group="phone"><button class="zoom" aria-label="Enlarge Landscape phone map"><img src="screenshots/map-phone-landscape-full.png" alt="Landscape phone map" loading="lazy"></button><figcaption>Landscape phone map</figcaption></figure><figure data-group="map"><button class="zoom" aria-label="Enlarge Tablet world map"><img src="screenshots/map-tablet-full.png" alt="Tablet world map" loading="lazy"></button><figcaption>Tablet world map</figcaption></figure><figure data-group="editor"><button class="zoom" aria-label="Enlarge Phone model catalogue"><img src="screenshots/catalogue-phone.png" alt="Phone model catalogue" loading="lazy"></button><figcaption>Phone model catalogue</figcaption></figure><figure data-group="editor"><button class="zoom" aria-label="Enlarge Selected model outline"><img src="screenshots/selection-desktop.png" alt="Selected model outline" loading="lazy"></button><figcaption>Selected model outline</figcaption></figure><figure data-group="editor"><button class="zoom" aria-label="Enlarge Phone placement controls"><img src="screenshots/placement-phone.png" alt="Phone placement controls" loading="lazy"></button><figcaption>Phone placement controls</figcaption></figure><figure data-group="editor"><button class="zoom" aria-label="Enlarge Close-wall camera protection"><img src="screenshots/camera-close-wall.png" alt="Close-wall camera protection" loading="lazy"></button><figcaption>Close-wall camera protection</figcaption></figure><figure data-group="comparison"><button class="zoom" aria-label="Enlarge Meadow before new layout"><img src="screenshots/meadow-before.png" alt="Meadow before new layout" loading="lazy"></button><figcaption>Meadow before new layout</figcaption></figure><figure data-group="comparison"><button class="zoom" aria-label="Enlarge Meadow with curved earth lanes"><img src="screenshots/meadow-after.png" alt="Meadow with curved earth lanes" loading="lazy"></button><figcaption>Meadow with curved earth lanes</figcaption></figure><figure data-group="comparison"><button class="zoom" aria-label="Enlarge Road before batching/culling"><img src="screenshots/cost-road-before.png" alt="Road before batching/culling" loading="lazy"></button><figcaption>Road before batching/culling</figcaption></figure><figure data-group="comparison"><button class="zoom" aria-label="Enlarge Road after batching/culling and material join repair"><img src="screenshots/cost-road-after.png" alt="Road after batching/culling and material join repair" loading="lazy"></button><figcaption>Road after batching/culling and material join repair</figcaption></figure></div><dialog><button aria-label="Close enlarged image">Close ✕</button><img alt=""></dialog></main><script>const d=document.querySelector('dialog');for(const b of document.querySelectorAll('[data-filter]'))b.onclick=()=>{for(const f of document.querySelectorAll('figure'))f.hidden=b.dataset.filter!=='all'&&f.dataset.group!==b.dataset.filter;for(const x of document.querySelectorAll('[data-filter]'))x.setAttribute('aria-pressed',x===b);};for(const b of document.querySelectorAll('.zoom'))b.onclick=()=>{d.querySelector('img').src=b.querySelector('img').src;d.querySelector('img').alt=b.querySelector('img').alt;d.showModal();};d.querySelector('button').onclick=()=>d.close();</script></body></html>
