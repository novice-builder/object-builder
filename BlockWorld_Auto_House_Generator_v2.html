<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><meta name="theme-color" content="#101e2c"><title>BlockWorld · Wall Picker</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#c8d8e0;font:14px system-ui,-apple-system,Arial;touch-action:none}
#bar{position:absolute;z-index:5;top:0;left:0;right:0;padding:calc(env(safe-area-inset-top) + 8px) 8px 8px;display:flex;gap:6px;background:#102b3a;align-items:center}
button{border:1px solid #688999;border-radius:9px;color:#f4faff;background:#264c60;padding:10px 10px;font:inherit;white-space:nowrap;min-height:40px;flex:1}
button.selected{background:#158a98;border-color:#58c8cf}button.danger{background:#9a4848;border-color:#e19898}button:active{filter:brightness(1.2)}
#opacityWrap{position:absolute;z-index:8;top:calc(env(safe-area-inset-top) + 64px);left:8px;background:#102b3a;color:white;padding:14px;border-radius:12px;box-shadow:0 6px 20px #0005;display:none;width:min(290px,90vw)}
#opacityWrap.open{display:block}input[type=range]{width:100%}
#view{position:absolute;inset:0;overflow:hidden}
#plan,#three{width:100%;height:100%;display:block;touch-action:none}#three{display:none}
#hint{position:absolute;bottom:calc(env(safe-area-inset-bottom) + 12px);left:12px;right:12px;pointer-events:none;text-align:center;color:#fff;background:#172d3cce;padding:9px;border-radius:9px;font-size:12px}
#status{position:absolute;z-index:3;top:calc(env(safe-area-inset-top) + 64px);left:8px;pointer-events:none;color:#fff;background:#172d3ccc;border-radius:7px;padding:6px 9px;font-size:12px;max-width:78vw}
#file{display:none}
</style></head><body>
<div id="bar"><button id="upload">Upload</button><button id="opacity">Opacity</button><button id="mode">Edit / 3D</button><button id="action">Add wall</button></div>
<div id="opacityWrap"><div>Floor-plan opacity: <span id="opValue">75%</span></div><input type="range" id="op" min="0" max="100" value="75"></div>
<input id="file" type="file" accept="image/*">
<div id="view"><canvas id="plan"></canvas><canvas id="three"></canvas></div>
<div id="status">Upload a floor plan to start</div>
<div id="hint">Edit: tap a dark straight line to create a wall · two-finger drag to move · pinch to zoom</div>
<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.160.1/build/three.module.js';
const $=id=>document.getElementById(id);
const canvas=$('plan'),ctx=canvas.getContext('2d'),three=$('three');
let image=null,pixels=null,imgW=0,imgH=0,walls=[],editing=true,deleting=false,alpha=.75;
let zoom=1,tx=0,ty=0,base=1,barBottom=70;
let pointers=new Map(),lastDistance=0,panPoint=null;
const wallHeight=2.7,wallThickness=.18;
let worldScale=.03; // provisional 30 mm per plan pixel, no dimension calibration yet
const renderer=new THREE.WebGLRenderer({canvas:three,antialias:true});
renderer.setPixelRatio(Math.min(window.devicePixelRatio||1,1.7));
renderer.setClearColor(0xc8d8e0);
const scene=new THREE.Scene(),camera=new THREE.PerspectiveCamera(53,1,.1,1000);
scene.add(new THREE.HemisphereLight(0xffffff,0x6e7983,2.1));
const sun=new THREE.DirectionalLight(0xffffff,2);sun.position.set(30,70,40);scene.add(sun);
const grid=new THREE.GridHelper(80,80,0xa6b8bd,0xbacbd0);scene.add(grid);
let wallGroup=new THREE.Group();scene.add(wallGroup);
let yaw=.75,pitch=.85,distance=24,target=new THREE.Vector3(),orbitPointers=new Map(),orbitLast=null;
const status=s=>$('status').textContent=s;
function resize(){
 const dpr=Math.min(devicePixelRatio||1,2),width=innerWidth,height=innerHeight;
 canvas.width=Math.round(width*dpr);canvas.height=Math.round(height*dpr);
 canvas.style.width=width+'px';canvas.style.height=height+'px';
 ctx.setTransform(dpr,0,0,dpr,0,0);
 renderer.setSize(width,height,false);camera.aspect=width/height;camera.updateProjectionMatrix();
 barBottom=$('bar').getBoundingClientRect().bottom;
 if(image&&base===1)fitImage();else draw();
}
function fitImage(){if(!image)return;const availH=innerHeight-barBottom-30; zoom=1;base=Math.min((innerWidth-26)/imgW,availH/imgH);tx=(innerWidth-imgW*base)/2;ty=barBottom+12+(availH-imgH*base)/2;draw();}
function point(x,y){return{x:(x-tx)/(base*zoom),y:(y-ty)/(base*zoom)}}
function draw(){
 if(!editing)return;
 ctx.clearRect(0,0,innerWidth,innerHeight);ctx.fillStyle='#eef2f3';ctx.fillRect(0,0,innerWidth,innerHeight);
 if(!image)return;
 ctx.save();ctx.translate(tx,ty);ctx.scale(base*zoom,base*zoom);
 ctx.globalAlpha=alpha;ctx.drawImage(image,0,0);ctx.globalAlpha=1;
 ctx.lineCap='butt';ctx.lineJoin='miter';
 for(const wall of walls){
  ctx.beginPath();ctx.moveTo(wall.x1,wall.y1);ctx.lineTo(wall.x2,wall.y2);
  ctx.lineWidth=Math.max(2.5,wall.width||4);ctx.strokeStyle='#00b7e8bb';ctx.stroke();
  ctx.strokeStyle='#004d63';ctx.lineWidth=Math.max(1,(wall.width||4)*.32);ctx.stroke();
  for(const [x,y] of [[wall.x1,wall.y1],[wall.x2,wall.y2]]){ctx.beginPath();ctx.arc(x,y,3.2,0,Math.PI*2);ctx.fillStyle='#ffbc2d';ctx.fill()}
 }
 ctx.restore();
}
function dark(x,y){if(!pixels)return false;x=Math.round(x);y=Math.round(y);if(x<0||x>=imgW||y<0||y>=imgH)return false;const o=(y*imgW+x)*4;return pixels[o]*.299+pixels[o+1]*.587+pixels[o+2]*.114<115&&pixels[o+3]>100}
function runAt(x,y,axis){
 const coord=axis==='h'?x:y,other=axis==='h'?y:x,limit=axis==='h'?imgW:imgH;
 const test=(n,r)=>axis==='h'?dark(n,r):dark(r,n);
 let best=null;
 for(let shift=-4;shift<=4;shift++){
  const row=Math.round(other+shift),c=Math.round(coord);
  if(!test(c,row))continue;
  let lo=c,hi=c;
  // Allow at most a single light pixel in a black line, not a missing doorway.
  while(lo>0&&(test(lo-1,row)||(lo>1&&test(lo-2,row))))lo-=test(lo-1,row)?1:2;
  while(hi<limit-1&&(test(hi+1,row)||(hi<limit-2&&test(hi+2,row))))hi+=test(hi+1,row)?1:2;
  const length=hi-lo+1;
  if(!best||length>best.length)best={lo,hi,row,length,axis};
 }
 return best;
}
function snapped(p){
 const limit=11,ends=walls.flatMap(w=>[[w.x1,w.y1],[w.x2,w.y2]]);
 let closest=null,d=limit;
 for(const q of ends){const dd=Math.hypot(q[0]-p[0],q[1]-p[1]);if(dd<d){d=dd;closest=q}}
 return closest||p;
}
function selectLine(ix,iy){
 if(!pixels)return null;
 let nearest=null,closest=16;
 for(let y=Math.max(0,Math.floor(iy-16));y<=Math.min(imgH-1,Math.ceil(iy+16));y++)
  for(let x=Math.max(0,Math.floor(ix-16));x<=Math.min(imgW-1,Math.ceil(ix+16));x++){
    if(!dark(x,y))continue;
    const d=Math.hypot(x-ix,y-iy);
    if(d<closest){closest=d;nearest=[x,y]}
  }
 if(!nearest)return null;
 const [x,y]=nearest;
 const h=runAt(x,y,'h'),v=runAt(x,y,'v');
 const candidates=[h,v].filter(r=>r&&r.length>=8);
 if(!candidates.length)return null;
 candidates.sort((a,b)=>b.length-a.length);
 const r=candidates[0],axis=r.axis;
 // Estimate center of thick strokes, preserving exact observed endpoints.
 const p1=axis==='h'?[r.lo,r.row]:[r.row,r.lo],p2=axis==='h'?[r.hi,r.row]:[r.row,r.hi];
 let a=snapped(p1),b=snapped(p2);
 if(Math.hypot(b[0]-a[0],b[1]-a[1])<8)return null;
 return{x1:a[0],y1:a[1],x2:b[0],y2:b[1],width:Math.max(2,Math.min(13,estimateWidth(r)))};
}
function estimateWidth(r){
 const x=r.axis==='h'?Math.round((r.lo+r.hi)/2):r.row;
 const y=r.axis==='h'?r.row:Math.round((r.lo+r.hi)/2);
 let neg=0,pos=0;
 for(let k=1;k<=18;k++){if(r.axis==='h'?dark(x,y-k):dark(x-k,y))neg++;else break}
 for(let k=1;k<=18;k++){if(r.axis==='h'?dark(x,y+k):dark(x+k,y))pos++;else break}
 return 1+neg+pos;
}
function distanceSegment(x,y,w){const vx=w.x2-w.x1,vy=w.y2-w.y1,l=vx*vx+vy*vy,t=Math.max(0,Math.min(1,((x-w.x1)*vx+(y-w.y1)*vy)/(l||1)));return Math.hypot(x-(w.x1+t*vx),y-(w.y1+t*vy))}
function editTap(x,y){
 const p=point(x,y);
 if(deleting){
  let best=-1,dist=12/(base*zoom);
  walls.forEach((w,i)=>{const d=distanceSegment(p.x,p.y,w);if(d<dist){best=i;dist=d}});
  if(best>=0){walls.splice(best,1);status(walls.length+' walls · removed');draw();build3D()}
  return;
 }
 const w=selectLine(p.x,p.y);
 if(!w){status('No continuous dark line found here');return}
 if(walls.some(a=>distanceSegment(w.x1,w.y1,a)<5&&distanceSegment(w.x2,w.y2,a)<5)){status('Already selected');return}
 walls.push(w);
 status(walls.length+' walls · tap another dark line');
 draw();build3D();
}
function build3D(){
 while(wallGroup.children.length){const o=wallGroup.children.pop();o.geometry?.dispose();o.material?.dispose()}
 const cx=imgW/2,cy=imgH/2;
 for(const w of walls){
  const x1=(w.x1-cx)*worldScale,z1=(w.y1-cy)*worldScale,x2=(w.x2-cx)*worldScale,z2=(w.y2-cy)*worldScale;
  const length=Math.hypot(x2-x1,z2-z1);
  if(length<.05)continue;
  const obj=new THREE.Mesh(new THREE.BoxGeometry(length,wallHeight,wallThickness),new THREE.MeshLambertMaterial({color:0xf2e8d7}));
  obj.position.set((x1+x2)/2,wallHeight/2,(z1+z2)/2);obj.rotation.y=-Math.atan2(z2-z1,x2-x1);wallGroup.add(obj);
 }
 const range=Math.max(imgW,imgH)*worldScale;
 distance=Math.max(13,range*1.4);target.set(0,0,0);updateCamera();
}
function updateCamera(){pitch=Math.max(.15,Math.min(1.5,pitch));camera.position.set(target.x+distance*Math.sin(pitch)*Math.sin(yaw),target.y+distance*Math.cos(pitch),target.z+distance*Math.sin(pitch)*Math.cos(yaw));camera.lookAt(target)}
function render(){requestAnimationFrame(render);if(!editing)renderer.render(scene,camera)}
render();
function toggleMode(){
 editing=!editing;canvas.style.display=editing?'block':'none';three.style.display=editing?'none':'block';
 $('mode').classList.toggle('selected',!editing);
 $('hint').textContent=editing?'Edit: tap a dark straight line · two-finger drag to pan · pinch to zoom':'3D: drag to orbit · pinch to zoom · walls only';
 if(editing)draw();else{updateCamera();renderer.render(scene,camera)}
}
$('mode').onclick=toggleMode;
$('action').onclick=()=>{
 deleting=!deleting;$('action').textContent=deleting?'Delete wall':'Add wall';
 $('action').classList.toggle('danger',deleting);
 status(deleting?'Tap an added wall to remove it':'Tap a dark floor-plan line to add a wall');
};
$('opacity').onclick=()=>{$('opacityWrap').classList.toggle('open');$('opacity').classList.toggle('selected')};
$('op').oninput=e=>{alpha=+e.target.value/100;$('opValue').textContent=e.target.value+'%';draw()};
$('upload').onclick=()=>$('file').click();
$('file').onchange=e=>{
 const f=e.target.files[0];if(!f)return;
 const url=URL.createObjectURL(f),img=new Image();
 img.onload=()=>{
  image=img;imgW=img.naturalWidth;imgH=img.naturalHeight;
  // Bound scanning cost for large screenshots while keeping ratios.
  const c=document.createElement('canvas');c.width=imgW;c.height=imgH;
  const cx=c.getContext('2d',{willReadFrequently:true});cx.drawImage(img,0,0);
  pixels=cx.getImageData(0,0,imgW,imgH).data;
  walls=[];base=1;fitImage();build3D();status('Loaded '+imgW+' × '+imgH+' · tap lines to add walls');
  URL.revokeObjectURL(url);
 };
 img.onerror=()=>status('Could not read this image');
 img.src=url;e.target.value='';
};
canvas.addEventListener('pointerdown',e=>{canvas.setPointerCapture(e.pointerId);pointers.set(e.pointerId,{x:e.clientX,y:e.clientY,sx:e.clientX,sy:e.clientY});if(pointers.size===2){const p=[...pointers.values()];lastDistance=Math.hypot(p[0].x-p[1].x,p[0].y-p[1].y);panPoint={x:(p[0].x+p[1].x)/2,y:(p[0].y+p[1].y)/2}}});
canvas.addEventListener('pointermove',e=>{if(!pointers.has(e.pointerId))return;const p=pointers.get(e.pointerId);p.x=e.clientX;p.y=e.clientY;
 if(pointers.size===2){const pts=[...pointers.values()],mid={x:(pts[0].x+pts[1].x)/2,y:(pts[0].y+pts[1].y)/2},dist=Math.hypot(pts[0].x-pts[1].x,pts[0].y-pts[1].y);
 if(panPoint){tx+=mid.x-panPoint.x;ty+=mid.y-panPoint.y}
 if(lastDistance>0&&dist>0){const before=point(mid.x,mid.y);zoom=Math.max(.3,Math.min(12,zoom*dist/lastDistance));tx=mid.x-before.x*base*zoom;ty=mid.y-before.y*base*zoom}
 panPoint=mid;lastDistance=dist;draw() }
});
function finish(e){const p=pointers.get(e.pointerId);if(!p)return;const one=pointers.size===1;pointers.delete(e.pointerId);if(one&&Math.hypot(e.clientX-p.sx,e.clientY-p.sy)<12&&image)editTap(e.clientX,e.clientY);if(pointers.size<2){panPoint=null;lastDistance=0}}
canvas.addEventListener('pointerup',finish);canvas.addEventListener('pointercancel',e=>pointers.delete(e.pointerId));
canvas.addEventListener('wheel',e=>{e.preventDefault();const before=point(e.clientX,e.clientY);zoom=Math.max(.3,Math.min(12,zoom*(e.deltaY<0?1.13:.89)));tx=e.clientX-before.x*base*zoom;ty=e.clientY-before.y*base*zoom;draw()},{passive:false});
three.addEventListener('pointerdown',e=>{three.setPointerCapture(e.pointerId);orbitPointers.set(e.pointerId,{x:e.clientX,y:e.clientY})});
three.addEventListener('pointermove',e=>{if(!orbitPointers.has(e.pointerId))return;const p=orbitPointers.get(e.pointerId);if(orbitPointers.size===1){yaw-=(e.clientX-p.x)*.008;pitch+=(e.clientY-p.y)*.008;updateCamera()}else{const pts=[...orbitPointers.values()];if(orbitLast){const prev=Math.hypot(pts[0].x-pts[1].x,pts[0].y-pts[1].y),next=Math.hypot(e.clientX-pts[1].x,e.clientY-pts[1].y);if(prev>0&&next>0){distance=Math.max(3,Math.min(250,distance*prev/next));updateCamera()}}orbitLast=true}p.x=e.clientX;p.y=e.clientY});
three.addEventListener('pointerup',e=>{orbitPointers.delete(e.pointerId);orbitLast=null});
three.addEventListener('pointercancel',e=>{orbitPointers.delete(e.pointerId);orbitLast=null});
three.addEventListener('wheel',e=>{e.preventDefault();distance=Math.max(3,Math.min(250,distance*(e.deltaY>0?1.13:.88)));updateCamera()},{passive:false});
window.addEventListener('resize',resize);resize();updateCamera();
</script></body></html>
